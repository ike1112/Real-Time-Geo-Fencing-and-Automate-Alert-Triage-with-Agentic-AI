[pytest]
# importlib mode lets test modules in separate source trees coexist (the default
# prepend mode collides across dirs, and the lambda/ dir name is a Python keyword
# that blocks package mode). conftest.py puts each source dir on sys.path so the
# Lambda handler and the processor library import by their own names.
addopts = --import-mode=importlib
testpaths =
    lambda/rules_bridge
    lambda/analyzer_bridge
    lambda/publisher_bridge
    processor/geofence
    agents/analyzer
    agents/publisher
    eval
